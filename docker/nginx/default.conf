# Primeira camada contra floods: limita por IP antes de a requisição chegar ao PHP.
# Arquivos estáticos (/build, /assets) não entram na conta, então páginas carregam normalmente.
# Atrás de CDN/load balancer (Cloudflare etc.), configure real_ip para limitar pelo IP do visitante.
limit_req_zone $binary_remote_addr zone=fetech_web:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=fetech_api:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=fetech_conn:10m;

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn fetech_conn 20;

    # Corpo e cabeçalhos pequenos, timeouts curtos: corta slowloris e uploads abusivos
    client_max_body_size 8m;
    client_body_buffer_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    large_client_header_buffers 4 8k;
    keepalive_timeout 15s;
    send_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location /build/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location /assets/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location /api/ {
        limit_req zone=fetech_api burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        limit_req zone=fetech_web burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        # Acesso direto a /index.php também é limitado; o Nginx conta cada requisição uma única vez
        limit_req zone=fetech_web burst=40 nodelay;

        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    # Nenhum outro .php é executável
    location ~ \.php$ {
        return 404;
    }
}
