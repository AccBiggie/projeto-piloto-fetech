; Pool do PHP-FPM dimensionado para vários acessos simultâneos.
; Cada worker atende uma requisição por vez; ajuste max_children conforme a RAM do servidor.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
; Recicla workers periodicamente, sem carregar estado entre muitas requisições
pm.max_requests = 500
request_terminate_timeout = 30s
catch_workers_output = yes
decorate_workers_output = no
