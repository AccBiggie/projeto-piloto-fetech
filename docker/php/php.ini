; Configuração do PHP da aplicação.
; Os limites de entrada e o upload_progress desligado são camadas extras contra
; os CVE-2026-109618/109619; a correção em si é o PHP 8.5.12 ou superior.

expose_php = Off
display_errors = Off
log_errors = On
date.timezone = America/Sao_Paulo

memory_limit = 256M
max_execution_time = 30
max_input_time = 30
max_input_vars = 1000
max_input_nesting_level = 32
post_max_size = 8M
upload_max_filesize = 2M
max_file_uploads = 5

session.upload_progress.enabled = 0

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Desenvolvimento: recarrega arquivos alterados. Em produção use 0 em validate_timestamps.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
