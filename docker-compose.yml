services:
  webserver:
    container_name: fetech-serve
    build:
      context: .
    restart: always
    ports:
      - "3001:80"
    volumes:
      - ./:/var/www/html/
  #  environment:
  #    APP_ENV: local
  #    APP_DEBUG: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
  db:
      container_name: fetech-mysql
      image: mysql:8.0
      restart: "always"
      environment:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
      ports:
          - "3308:3306"
      volumes:
          - mysql_data:/var/lib/mysql
  phpmyadmin:
      container_name: fetech-phpmyadmin
      image: phpmyadmin/phpmyadmin:latest
      restart: "always"
      environment:
          PMA_HOST: db
          PMA_USER: root
          PMA_PASSWORD: root
      ports:
          - "8080:80"

volumes:
  mysql_data:
