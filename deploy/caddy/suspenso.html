<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Site temporariamente suspenso</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f5f6; --card: #fff; --ink: #1d2426; --muted: #55606a; --accent: #c81135; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15191b; --card: #1f2528; --ink: #eef1f2; --muted: #a9b3b9; --accent: #ff6b86; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; width: 100%; background: var(--card); border-radius: 16px; padding: 32px 28px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  .tag { display: inline-block; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: 26px; line-height: 1.25; margin: 8px 0 12px; }
  p { margin: 0 0 12px; color: var(--muted); }
  a { color: inherit; font-weight: 600; }
  small { display: block; margin-top: 20px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <span class="tag">Indisponível</span>
  <h1>Este site está temporariamente suspenso</h1>
  <p>O endereço que você acessou está fora do ar no momento. Tente novamente mais tarde.</p>
  <p>Se você é o responsável por este site, fale com a FETECH pelo <a href="https://www.fetech.systems/">fetech.systems</a> para regularizar o acesso.</p>
  <small>Hospedagem FETECH</small>
</main>
</body>
</html>
